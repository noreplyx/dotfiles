id = "dotfiles.dev-servers"
name = "Dev Servers"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Detect and manage dotnet run, pnpm run dev, and npm run dev processes across Herdr workspaces and panes."
platforms = ["windows", "linux", "macos"]

[[startup]]
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "./scripts/dev-servers.ps1", "--daemon"]

[[actions]]
id = "open"
title = "Dev Servers: show active servers"
description = "Open the Dev Servers overlay board"
contexts = ["global", "workspace", "pane"]
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "./scripts/dev-servers.ps1", "--open"]

[[actions]]
id = "stop"
title = "Dev Servers: stop workspace servers"
description = "Stop detected dev servers in the current workspace"
contexts = ["workspace", "pane"]
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "./scripts/dev-servers.ps1", "--stop"]

[[panes]]
id = "board"
title = "Dev Servers"
placement = "overlay"
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "./scripts/dev-servers.ps1", "--pane"]
