onboarding = false

[keys]
open_worktree = "prefix+shift+o"

[theme]
name = "tokyo-night"

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "herdr-plugins.birdseye.show"
description = "show birdseye view"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "herdr plugin pane open --plugin dnzzl.automations --entrypoint board --placement overlay"
description = "show automations board"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "zenbu-labs.terminal-browser.open-split"
description = "open terminal-browser (right split)"

[[keys.command]]
key = "prefix+shift+a"
type = "shell"
command = "powershell -WindowStyle Hidden -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command \"& \\\"$HOME/.config/herdr/scripts/keep-awake.ps1\\\" --toggle\" || ~/.config/herdr/scripts/keep-awake.sh --toggle"
description = "toggle screen keep-awake"

[[keys.command]]
key = "prefix+d"
type = "shell"
command = "herdr plugin pane open --plugin dotfiles.dev-servers --entrypoint board --placement overlay"
description = "show dev servers"

[terminal]
kitty_graphics = true

[ui]
tab_bar_right = [
  { type = "command", command = "powershell -WindowStyle Hidden -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command \"& \\\"$HOME/.config/herdr/plugins/dev-servers/scripts/dev-servers.ps1\\\" --badge\" || ~/.config/herdr/plugins/dev-servers/scripts/dev-servers.sh --badge", interval_seconds = 2, timeout_seconds = 5 },
  { type = "command", command = "powershell -WindowStyle Hidden -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command \"& \\\"$HOME/.config/herdr/scripts/keep-awake.ps1\\\" --badge\" || ~/.config/herdr/scripts/keep-awake.sh --badge", interval_seconds = 1, timeout_seconds = 2 },
  { type = "zoom" },
]
