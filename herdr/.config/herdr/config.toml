onboarding = false

[keys]
open_worktree = "prefix+shift+o"
previous_agent = "alt+["
next_agent = "alt+]"

[theme]
name = "tokyo-night"

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "herdr-plugins.birdseye.show"
description = "show birdseye view"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "herdr plugin pane open --plugin dnzzl.automations --entrypoint board --placement overlay"
description = "show automations board"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "zenbu-labs.terminal-browser.open-split"
description = "open terminal-browser (right split)"

[[keys.command]]
key = "prefix+shift+a"
type = "shell"
command = "powershell -NoLogo -WindowStyle Hidden -NoProfile -NonInteractive -ExecutionPolicy Bypass -File \"%USERPROFILE%/.config/herdr/scripts/keep-awake.ps1\" --toggle || ~/.config/herdr/scripts/keep-awake.sh --toggle"
description = "toggle screen keep-awake"

[[keys.command]]
key = "prefix+o"
type = "popup"
width = "85%"
height = "85%"
command = "powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File \"%USERPROFILE%/.config/herdr/scripts/git-workspace-manager.ps1\" || ~/.config/herdr/scripts/git-workspace-manager.sh"
description = "git workspace manager"

[terminal]
kitty_graphics = true

[ui]
tab_bar_right = [
  { type = "command", command = "cmd.exe /d /c \"type \\\"%USERPROFILE%\\.cache\\herdr-keep-awake.badge\\\" 2>nul\" || cat \"$HOME/.cache/herdr-keep-awake.badge\" 2>/dev/null || echo AWAKE: OFF", interval_seconds = 5, timeout_seconds = 5 },
  { type = "zoom" },
]
