set-option -g default-shell "/bin/zsh"
set-option -g default-command "/bin/zsh"
set -g allow-passthrough on
set -g default-terminal "tmux-256color"
set -g mouse on
set -g history-limit 50000

# Pane resize keybindings (vim-style)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Launch yazi in a new window
bind y run-shell "tmux new-window -n yazi 'yazi'"

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g @sessionx-bind 'o'
set -g @sessionx-custom-paths '~/Codes'
set -g @sessionx-filter-current "false"
set -g @sessionx-additional-options "--color pointer:9,spinner:92,marker:46 --color border:green:bold --color label:green:bold"

set -g status-left '#{prefix_highlight} | #S | %H:%M'
set -g status-left-length 50

# Keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'
run-shell 'bash ~/Codes/dotfiles/tmux/scripts/apply-plugin-overrides.sh'
