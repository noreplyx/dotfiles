[mgr]
ratio = [ 1, 4, 3 ]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
show_hidden = true
show_symlink = true
scrolloff = 5
linemode = "size"

[preview]
wrap = "no"
tab_size = 4
max_width = 1000
max_height = 1000
image_delay = 30
image_filter = "lanczos3"
image_quality = 80

[opener]
edit = [
	{ run = "$EDITOR %s", block = true, for = "unix" },
	{ run = "%EDITOR% %s", block = true, for = "windows" },
]
play = [
	{ run = "celluloid %s1", desc = "Play", for = "unix" },
]
open = [
	{ run = "xdg-open %s1", desc = "Open", for = "unix" },
	{ run = "open %s1", desc = "Open", for = "macos" },
]

[open]
prepend_rules = [
	{ mime = "text/*", use = "edit" },
	{ mime = "application/json", use = "edit" },
	{ url = "*.json", use = "edit" },
	{ url = "*.md", use = "edit" },
	{ url = "*.toml", use = "edit" },
	{ url = "*.lua", use = "edit" },
	{ url = "*.yaml", use = "edit" },
	{ url = "*.yml", use = "edit" },
	{ url = "*.sh", use = "edit" },
	{ url = "*.zsh", use = "edit" },
	{ url = "*.conf", use = "edit" },
	{ url = "*.txt", use = "edit" },
	{ mime = "{audio,video}/*", use = "play" },
]

[tasks]
file_workers = 4
plugin_workers = 4
fetch_workers = 4
preload_workers = 4
process_workers = 4
bizarre_retry = 5
suppress_preload = false
image_alloc = 0
image_bound = [ 0, 0 ]

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

[input]
cursor_blink = true

[which]
sort_by = "key"
sort_sensitive = false
sort_reverse = false
sort_translit = false
